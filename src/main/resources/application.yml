server:
  port: 8088
  servlet:
    session:
      timeout: 30d
      cookie:
        name: LOVESESSION
        max-age: 30d
        http-only: true
        same-site: lax
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# 数据库配置
spring:
  application:
    name: Love
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/love_order_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=30000
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  
  # 字符编码配置
  web:
    resources:
      encoding:
        charset: UTF-8
        enabled: true
        force: true
  
  # Thymeleaf配置
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  
  # HTTP消息转换器配置
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.wrt.excel.order.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 限流配置
rate-limiter:
  # 默认QPS限制
  default-qps: 10
  # 不同接口的限流配置
  apis:
    upload-api: 5
    query-api: 20

# 第三方接口配置
provincial:
  api:
    url: http://localhost:8081/provincial

# Actuator：仅匿名暴露健康检查（info/metrics 等不对外开放）
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# 日志配置
logging:
  level:
    com.wrt.excel: DEBUG

# MinIO配置
minio:
  endpoint: http://47.102.84.75:9000  # MinIO服务器地址，请根据实际情况修改
  access-key: ${MINIO_ACCESS_KEY:minioadmin}           # MinIO访问密钥，请根据实际情况修改
  secret-key: ${MINIO_SECRET_KEY:minioadmin}           # MinIO秘密密钥，请根据实际情况修改
  bucket-name: dishes              # 存储桶名称
  public-read: false               # 列表/详情按对象键重新签名，避免过期链接 403

# Server酱配置
serverchan:
    key: ${SERVERCHAN_SENDKEY:}
# 本地图片上传目录（MinIO 不可用时回退）
love:
  remember:
    secret: ${LOVE_REMEMBER_SECRET:CHANGE_ME_REMEMBER_SECRET}
  upload:
    dir: uploads
# DeepSeek 一句话点单（OpenAI 兼容 Chat Completions）
# 环境变量 DEEPSEEK_API_KEY；未配置时接口返回明确错误，不会假加购
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  model: deepseek-chat
  timeout-seconds: 30

# WeChat MP 测试号（密钥仅来自环境变量，勿把 secret 写进仓库）
wechat:
  enabled: ${WECHAT_ENABLED:true}
  app-id: ${WECHAT_APP_ID:}
  app-secret: ${WECHAT_APP_SECRET:}
  token: ${WECHAT_TOKEN:}
  chef-openid: ${WECHAT_CHEF_OPENID:}
  orderer-openid: ${WECHAT_ORDERER_OPENID:}
  template-new-order: ${WECHAT_TEMPLATE_NEW_ORDER:}
  template-status: ${WECHAT_TEMPLATE_STATUS:}

# 高德 Web 服务 Key（逆地理）；未配置时家人位置只显示经纬度
amap:
  web-key: ${AMAP_WEB_KEY:}
  regeo-url: https://restapi.amap.com/v3/geocode/regeo
  timeout-seconds: 3
