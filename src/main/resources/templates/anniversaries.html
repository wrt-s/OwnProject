<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FCE8EE">
<title>纪念日 · Love</title>
<link rel="stylesheet" href="/css/love.css">

<style>

</style>
</head>
<body>
<div class="app subpage">
  <header class="sub-header">
    <button type="button" class="back-btn" onclick="LovePage.back()" aria-label="返回">‹</button>
    <div class="sub-title">纪念日</div>
    
  </header>
  <main class="sub-body">

<div class="lp-hero"><div class="emoji">💍</div><div class="desc">记得每一个重要日子</div></div>
<div style="margin-bottom:12px"><button class="lp-btn block" type="button" onclick="showAddModal()">＋ 添加纪念日</button></div>
<div id="anniList" class="lp-list"><div class="lp-empty"><div class="ico">⏳</div><p>加载中…</p></div></div>

<div class="lp-modal-mask" id="anniModal" onclick="if(event.target===this)closeModal()">
  <div class="lp-modal" onclick="event.stopPropagation()">
    <div class="handle"></div>
    <div class="hd"><span id="anniModalTitle">添加纪念日</span><button class="x" type="button" onclick="closeModal()">×</button></div>
    <input type="hidden" id="anniId">
    <div class="lp-field"><label>标题</label><input id="anniTitle" placeholder="例如：在一起纪念日"></div>
    <div class="lp-field"><label>日期</label><input id="anniDate" type="date"></div>
    <div class="lp-field"><label>类型</label>
      <select id="anniType">
        <option value="first_date">恋爱</option>
        <option value="birthday">生日</option>
        <option value="wedding">结婚</option>
        <option value="custom">其他</option>
      </select>
    </div>
    <div class="lp-field"><label>备注</label><textarea id="anniRemark" placeholder="可选"></textarea></div>
    <button class="lp-btn block" type="button" onclick="saveAnniversary()">保存</button>
  </div>
</div>

  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/js/love-page.js"></script>
<script>

let userId = null;
(async function () {
  const u = await LovePage.ready({ chefOnly: false });
  if (!u) return;
  userId = LovePage.getUserId();
  if (typeof window.__afterAuth === 'function') await window.__afterAuth();
})();


let editingId = null;
function normalizeType(t) {
  const k = String(t || 'custom').toLowerCase();
  return ({ love:'first_date', first_date:'first_date', birthday:'birthday', wedding:'wedding', custom:'custom', other:'custom',
            love_day:'first_date', anniversary:'first_date' })[k] || 'custom';
}
function getTypeIcon(t) {
  const k = normalizeType(t);
  return ({ first_date:'💕', birthday:'🎂', wedding:'💍', custom:'📌' })[k] || '📌';
}
function getTypeLabel(t) {
  const k = normalizeType(t);
  return ({ first_date:'恋爱', birthday:'生日', wedding:'结婚', custom:'其他' })[k] || '其他';
}
function getDaysUntil(dateStr) {
  if (!dateStr) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  const d = new Date(dateStr); if (isNaN(d)) return null;
  d.setFullYear(now.getFullYear());
  if (d < now) d.setFullYear(now.getFullYear() + 1);
  return Math.round((d - now) / 86400000);
}
async function loadAnniversaries() {
  const box = document.getElementById('anniList');
  try {
    const r = await LovePage.api(`/api/anniversary/list/${userId}`);
    const list = (r.code === 200 && (r.data?.list || r.data)) || [];
    const arr = Array.isArray(list) ? list : [];
    if (!arr.length) {
      box.innerHTML = '<div class="lp-empty"><div class="ico">💍</div><p>还没有纪念日</p></div>';
      return;
    }
    box.innerHTML = arr.map(a => {
      const id = a.id;
      const title = a.title || a.name || '纪念日';
      const date = (a.date || a.anniversaryDate || '').toString().slice(0,10);
      const type = a.type || 'custom';
      const days = a.daysUntil != null ? a.daysUntil : getDaysUntil(date);
      const daysText = days == null ? '' : (days === 0 ? '就是今天 🎉' : `还有 ${days} 天`);
      const editPayload = JSON.stringify({id, title, date, type, remark: a.remark || a.note || a.description || ''});
      return `<div class="lp-item">
        <div class="row">
          <div style="display:flex;gap:10px;align-items:center;min-width:0">
            <div style="font-size:26px">${getTypeIcon(type)}</div>
            <div style="min-width:0">
              <div class="title">${LovePage.escapeHtml(title)}</div>
              <div class="meta">${getTypeLabel(type)} · ${LovePage.escapeHtml(date)}${daysText ? ' · ' + daysText : ''}</div>
            </div>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="lp-btn sm ghost" type="button" onclick='editAnniversary(${editPayload})'>编辑</button>
          <button class="lp-btn sm danger" type="button" onclick="deleteAnniversary(${id})">删除</button>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    console.error('loadAnniversaries failed', e);
    box.innerHTML = '<div class="lp-empty"><p>加载失败</p></div>';
  }
}
function showAddModal() {
  editingId = null;
  document.getElementById('anniModalTitle').textContent = '添加纪念日';
  document.getElementById('anniId').value = '';
  document.getElementById('anniTitle').value = '';
  document.getElementById('anniDate').value = '';
  document.getElementById('anniType').value = 'first_date';
  document.getElementById('anniRemark').value = '';
  document.getElementById('anniModal').classList.add('show');
}
function editAnniversary(a) {
  editingId = a.id;
  document.getElementById('anniModalTitle').textContent = '编辑纪念日';
  document.getElementById('anniId').value = a.id;
  document.getElementById('anniTitle').value = a.title || '';
  document.getElementById('anniDate').value = a.date || '';
  document.getElementById('anniType').value = normalizeType(a.type);
  document.getElementById('anniRemark').value = a.remark || '';
  document.getElementById('anniModal').classList.add('show');
}
function closeModal(){ document.getElementById('anniModal').classList.remove('show'); }
async function saveAnniversary() {
  const title = document.getElementById('anniTitle').value.trim();
  const date = document.getElementById('anniDate').value;
  const type = document.getElementById('anniType').value;
  const remark = document.getElementById('anniRemark').value.trim();
  if (!title || !date) { LovePage.toast('请填写标题和日期'); return; }
  const payload = { userId, title, name: title, date, anniversaryDate: date, type: normalizeType(type), remark, description: remark, note: remark, isActive: 1 };
  const url = editingId ? '/api/anniversary/update' : '/api/anniversary/add';
  if (editingId) payload.id = editingId;
  try {
    const r = await LovePage.api(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (r.code === 200) { LovePage.toast('已保存'); closeModal(); loadAnniversaries(); }
    else LovePage.toast(r.message || '保存失败');
  } catch (e) { LovePage.toast('网络错误'); }
}
async function deleteAnniversary(id) {
  if (!confirm('确定删除这个纪念日？')) return;
  try {
    const r = await LovePage.api(`/api/anniversary/delete/${id}`, { method: 'DELETE' });
    if (r.code === 200) { LovePage.toast('已删除'); loadAnniversaries(); }
    else LovePage.toast(r.message || '删除失败');
  } catch (e) { LovePage.toast('网络错误'); }
}
window.__afterAuth = loadAnniversaries;

</script>
</body>
</html>
