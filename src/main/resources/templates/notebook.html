<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FCE8EE">
<title>记事本 · Love</title>
<link rel="stylesheet" href="/css/love.css">

<style></style>
</head>
<body>
<div class="app subpage">
  <header class="sub-header">
    <button type="button" class="back-btn" onclick="LovePage.back()" aria-label="返回">‹</button>
    <div class="sub-title">记事本</div>
  </header>
  <main class="sub-body">
<div class="lp-hero"><div class="emoji">📔</div><div class="desc">悄悄记下想说的话</div></div>
<div class="lp-field" style="margin-bottom:8px">
  <input id="searchKw" type="search" placeholder="搜索笔记" onkeydown="if(event.key==='Enter')searchNotes()">
</div>
<div class="lp-chips" id="catChips">
  <button class="lp-chip active" type="button" data-c="" onclick="filterByCategory('')">全部</button>
  <button class="lp-chip" type="button" data-c="日常" onclick="filterByCategory('日常')">日常</button>
  <button class="lp-chip" type="button" data-c="心情" onclick="filterByCategory('心情')">心情</button>
  <button class="lp-chip" type="button" data-c="备忘" onclick="filterByCategory('备忘')">备忘</button>
</div>
<div style="margin-bottom:12px"><button class="lp-btn block" type="button" onclick="openModal()">＋ 写笔记</button></div>
<div id="noteList" class="lp-list"><div class="lp-empty"><div class="ico">⏳</div><p>加载中…</p></div></div>
<div class="lp-modal-mask" id="noteModal" onclick="if(event.target===this)closeModal()">
  <div class="lp-modal" onclick="event.stopPropagation()">
    <div class="handle"></div>
    <div class="hd"><span id="noteModalTitle">写笔记</span><button class="x" type="button" onclick="closeModal()">×</button></div>
    <div class="lp-field"><label>标题</label><input id="noteTitle" placeholder="标题"></div>
    <div class="lp-field"><label>分类</label>
      <select id="noteCategory"><option>日常</option><option>心情</option><option>备忘</option><option>其他</option></select>
    </div>
    <div class="lp-field"><label>内容</label><textarea id="noteContent" placeholder="写点什么…"></textarea></div>
    <button class="lp-btn block" type="button" onclick="saveNote()">保存</button>
  </div>
</div>
</main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/js/love-page.js"></script>

<script>
let userId = null;
(async function () {
  const u = await LovePage.ready({ chefOnly: false });
  if (!u) return;
  userId = LovePage.getUserId();
  if (typeof window.__afterAuth === 'function') await window.__afterAuth();
})();


let editingId=null, currentCategory='';
function formatDate(s){ return (s||'').toString().slice(0,16).replace('T',' '); }
async function loadNotes(){
  const box=document.getElementById('noteList');
  try{
    let url=`/api/notebook/list?userId=${userId}`;
    if(currentCategory) url=`/api/notebook/category?userId=${userId}&category=${encodeURIComponent(currentCategory)}`;
    const r=await LovePage.api(url);
    renderNotes((r.code===200&&(r.data?.list||r.data))||[]);
  }catch(e){ box.innerHTML='<div class="lp-empty"><p>加载失败</p></div>'; }
}
function renderNotes(list){
  const box=document.getElementById('noteList');
  const arr=Array.isArray(list)?list.slice():[];
  if(!arr.length){ box.innerHTML='<div class="lp-empty"><div class="ico">📔</div><p>还没有笔记</p></div>'; return; }
  arr.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
  box.innerHTML=arr.map(n=>{
    const id=n.id, title=n.title||'无标题', content=n.content||'', cat=n.category||'', pinned=!!n.pinned;
    const payload=JSON.stringify({id,title,content,category:cat}).replace(/'/g,"&#39;");
    return `<div class="lp-item">
      <div class="row"><div style="min-width:0">
        <div class="title">${pinned?'📌 ':''}${LovePage.escapeHtml(title)}</div>
        <div class="meta">${LovePage.escapeHtml(cat)} · ${LovePage.escapeHtml(formatDate(n.updateTime||n.createTime||n.createdAt))}</div>
        <div class="meta" style="margin-top:6px;color:var(--text-2)">${LovePage.escapeHtml(content).slice(0,80)}</div>
      </div></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">
        <button class="lp-btn sm ghost" type="button" data-note='${payload}' onclick="editNoteFromBtn(this)">编辑</button>
        <button class="lp-btn sm ghost" type="button" onclick="togglePin(${id},${pinned?'false':'true'})">${pinned?'取消置顶':'置顶'}</button>
        <button class="lp-btn sm danger" type="button" onclick="deleteNote(${id})">删除</button>
      </div>
    </div>`;
  }).join('');
}
function editNoteFromBtn(btn){
  try{ editNote(JSON.parse(btn.getAttribute('data-note'))); }catch(e){ LovePage.toast('打开失败'); }
}
function filterByCategory(c){
  currentCategory=c;
  document.querySelectorAll('#catChips .lp-chip').forEach(x=>x.classList.toggle('active', x.dataset.c===c));
  loadNotes();
}
async function searchNotes(){
  const kw=document.getElementById('searchKw').value.trim();
  if(!kw){ loadNotes(); return; }
  try{
    const r=await LovePage.api(`/api/notebook/search?userId=${userId}&keyword=${encodeURIComponent(kw)}`);
    renderNotes((r.code===200&&(r.data?.list||r.data))||[]);
  }catch(e){ LovePage.toast('搜索失败'); }
}
function openModal(){
  editingId=null;
  document.getElementById('noteModalTitle').textContent='写笔记';
  document.getElementById('noteTitle').value='';
  document.getElementById('noteContent').value='';
  document.getElementById('noteCategory').value='日常';
  document.getElementById('noteModal').classList.add('show');
}
function editNote(n){
  editingId=n.id;
  document.getElementById('noteModalTitle').textContent='编辑笔记';
  document.getElementById('noteTitle').value=n.title||'';
  document.getElementById('noteContent').value=n.content||'';
  document.getElementById('noteCategory').value=n.category||'日常';
  document.getElementById('noteModal').classList.add('show');
}
function closeModal(){ document.getElementById('noteModal').classList.remove('show'); }
async function saveNote(){
  const title=document.getElementById('noteTitle').value.trim();
  const content=document.getElementById('noteContent').value.trim();
  const category=document.getElementById('noteCategory').value;
  if(!title&&!content){ LovePage.toast('写点内容吧'); return; }
  const payload={userId,title,content,category};
  const url=editingId?'/api/notebook/update':'/api/notebook/add';
  if(editingId) payload.id=editingId;
  try{
    const r=await LovePage.api(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(r.code===200){ LovePage.toast('已保存'); closeModal(); loadNotes(); }
    else LovePage.toast(r.message||'保存失败');
  }catch(e){ LovePage.toast('网络错误'); }
}
async function deleteNote(id){
  if(!confirm('删除这篇笔记？')) return;
  try{
    const r=await LovePage.api(`/api/notebook/delete/${id}`,{method: 'DELETE'});
    if(r.code===200){ LovePage.toast('已删除'); loadNotes(); } else LovePage.toast(r.message||'失败');
  }catch(e){ LovePage.toast('网络错误'); }
}
async function togglePin(id, pin){
  try{
    const r=await LovePage.api('/api/notebook/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,userId,pinned:!!pin})});
    if(r.code===200){ loadNotes(); } else LovePage.toast(r.message||'失败');
  }catch(e){ LovePage.toast('网络错误'); }
}
window.__afterAuth=loadNotes;

</script>
</body>
</html>
