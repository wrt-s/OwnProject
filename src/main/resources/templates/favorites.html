<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FCE8EE">
<title>我的收藏 · Love</title>
<link rel="stylesheet" href="/css/love.css">

<style>

</style>
</head>
<body>
<div class="app subpage">
  <header class="sub-header">
    <button type="button" class="back-btn" onclick="LovePage.back()" aria-label="返回">‹</button>
    <div class="sub-title">我的收藏</div>
    
  </header>
  <main class="sub-body">

<div class="lp-hero"><div class="emoji">⭐</div><div class="desc">常吃清单 · 一键再点</div></div>
<div id="favoriteGrid" class="lp-list">
  <div class="lp-empty"><div class="ico">⏳</div><p>加载中…</p></div>
</div>

  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/js/love-page.js"></script>

<script>

let userId = null;
(async function () {
  const u = await LovePage.ready({ chefOnly: false });
  if (!u) return;
  userId = LovePage.getUserId();
  if (typeof window.__afterAuth === 'function') await window.__afterAuth();
})();


async function loadFavorites() {
  const box = document.getElementById('favoriteGrid');
  try {
    const r = await LovePage.api(`/api/favorite/list/${userId}`);
    const list = (r.code === 200 && (r.data?.list || r.data)) || [];
    const arr = Array.isArray(list) ? list : [];
    if (!arr.length) {
      box.innerHTML = '<div class="lp-empty"><div class="ico">⭐</div><p>还没有收藏菜品</p><p style="margin-top:8px;font-size:12px">去点单页点心收藏吧</p></div>';
      return;
    }
    box.innerHTML = arr.map(item => {
      const dish = item.dish || item;
      const id = item.id || item.favoriteId;
      const dishId = dish.id || item.dishId;
      const name = dish.name || item.dishName || '菜品';
      const price = dish.price ?? item.price ?? 0;
      const desc = dish.description || dish.desc || '';
      const emoji = dish.emoji || dish.icon || '🍜';
      return `<div class="lp-item">
        <div class="row">
          <div style="display:flex;gap:10px;align-items:center;min-width:0">
            <div style="font-size:28px;flex-shrink:0">${emoji}</div>
            <div style="min-width:0">
              <div class="title">${LovePage.escapeHtml(name)}</div>
              <div class="meta">${LovePage.escapeHtml(desc || ('💖 ' + price + ' 爱心币'))}</div>
            </div>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="lp-btn sm" type="button" onclick="orderDish(${Number(dishId)}, ${Number(price)}, '${LovePage.escapeHtml(name).replace(/'/g,"\\'")}')">再点一份</button>
          <button class="lp-btn sm ghost" type="button" onclick="removeFavorite(${Number(dishId)})">取消收藏</button>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    box.innerHTML = '<div class="lp-empty"><p>加载失败</p></div>';
  }
}
async function orderDish(dishId, price, name) {
  try {
    // reuse index cart via localStorage soft handoff
    let cart = [];
    try { cart = JSON.parse(localStorage.getItem('love_cart') || '[]'); } catch(e) {}
    const found = cart.find(c => c.dishId === dishId);
    if (found) found.quantity = (found.quantity || 1) + 1;
    else cart.push({ dishId, name, price, quantity: 1 });
    localStorage.setItem('love_cart', JSON.stringify(cart));
    LovePage.toast('已加入购物车，回首页提交');
  } catch (e) {
    LovePage.toast('加入失败');
  }
}
async function removeFavorite(id) {
  try {
    const r = await LovePage.api('/api/favorite/remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, dishId: id })
    });
    if (r.code === 200) {
      LovePage.toast('已取消收藏');
      loadFavorites();
    } else LovePage.toast(r.message || '操作失败');
  } catch (e) { LovePage.toast('网络错误'); }
}
window.__afterAuth = loadFavorites;

</script>
</body>
</html>
