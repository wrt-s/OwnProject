<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FCE8EE">
<title>成就系统 · Love</title>
<link rel="stylesheet" href="/css/love.css">

<style>

</style>
</head>
<body>
<div class="app subpage">
  <header class="sub-header">
    <button type="button" class="back-btn" onclick="LovePage.back()" aria-label="返回">‹</button>
    <div class="sub-title">成就系统</div>
    
  </header>
  <main class="sub-body">

<div class="lp-hero"><div class="emoji">🏆</div><div class="desc">解锁徽章 · 记录你们的点滴</div></div>
<div class="lp-stats" id="achStats">
  <div class="lp-stat"><div class="ico">🏅</div><div class="val" id="unlockedCount">0</div><div class="lbl">已解锁</div></div>
  <div class="lp-stat"><div class="ico">🎯</div><div class="val" id="totalCount">0</div><div class="lbl">全部</div></div>
  <div class="lp-stat"><div class="ico">📈</div><div class="val" id="progressPct">0%</div><div class="lbl">完成度</div></div>
</div>
<div style="margin-bottom:12px">
  <button class="lp-btn block ghost" type="button" onclick="checkNewAchievements()">检查新成就</button>
</div>
<div id="achList" class="lp-list"><div class="lp-empty"><div class="ico">⏳</div><p>加载中…</p></div></div>

  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/js/love-page.js"></script>

<script>

let userId = null;
(async function () {
  const u = await LovePage.ready({ chefOnly: false });
  if (!u) return;
  userId = LovePage.getUserId();
  if (typeof window.__afterAuth === 'function') await window.__afterAuth();
})();


async function loadAchievementStats() {
  try {
    const r = await LovePage.api(`/api/achievement/stats/${userId}`);
    if (r.code === 200 && r.data) {
      const d = r.data;
      const unlocked = d.unlocked ?? d.unlockedCount ?? 0;
      const total = d.total ?? d.totalCount ?? d.totalAchievements ?? 0;
      document.getElementById('unlockedCount').textContent = unlocked;
      document.getElementById('totalCount').textContent = total;
      const pct = total ? Math.round(unlocked * 100 / total) : 0;
      document.getElementById('progressPct').textContent = pct + '%';
    }
  } catch (e) {}
}
async function loadAllAchievements() {
  const box = document.getElementById('achList');
  try {
    const r = await LovePage.api(`/api/achievement/list/${userId}`);
    const list = (r.code === 200 && (r.data?.list || r.data)) || [];
    const arr = Array.isArray(list) ? list : [];
    if (!arr.length) {
      box.innerHTML = '<div class="lp-empty"><div class="ico">🏆</div><p>暂无成就</p></div>';
      return;
    }
    box.innerHTML = arr.map(a => {
      const unlocked = a.isUnlocked || a.unlocked || a.achieved || a.completed;
      const name = a.name || a.title || '成就';
      const desc = a.description || a.desc || '';
      const icon = a.icon || a.emoji || (unlocked ? '🏅' : '🔒');
      return `<div class="lp-item" style="opacity:${unlocked ? 1 : 0.55}">
        <div class="row">
          <div style="display:flex;gap:10px;align-items:center;min-width:0">
            <div style="font-size:28px">${icon}</div>
            <div style="min-width:0">
              <div class="title">${LovePage.escapeHtml(name)}</div>
              <div class="meta">${LovePage.escapeHtml(desc)}</div>
            </div>
          </div>
          <span style="font-size:11px;font-weight:700;color:${unlocked ? 'var(--ok)' : 'var(--muted)'}">${unlocked ? '已解锁' : '未解锁'}</span>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    box.innerHTML = '<div class="lp-empty"><p>加载失败</p></div>';
  }
}
async function checkNewAchievements() {
  try {
    const r = await LovePage.api(`/api/achievement/check/${userId}`, { method: 'POST' });
    if (r.code === 200) {
      const newly = r.data?.newlyUnlocked || r.data?.newAchievements || r.data;
      if (Array.isArray(newly) && newly.length) {
        LovePage.toast('解锁 ' + newly.length + ' 个新成就！');
      } else LovePage.toast(r.message || '暂无新成就');
      await loadAchievementStats();
      await loadAllAchievements();
    } else LovePage.toast(r.message || '检查失败');
  } catch (e) { LovePage.toast('网络错误'); }
}
window.__afterAuth = async () => {
  await loadAchievementStats();
  await loadAllAchievements();
};

</script>
</body>
</html>
