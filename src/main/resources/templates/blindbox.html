<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FCE8EE">
<title>惊喜盲盒 · Love</title>
<link rel="stylesheet" href="/css/love.css">
</head>
<body>
<div class="app subpage">
  <header class="sub-header">
    <button type="button" class="back-btn" onclick="LovePage.back()" aria-label="返回">‹</button>
    <div class="sub-title">惊喜盲盒</div>
  </header>
  <main class="sub-body">
    <div class="lp-hero"><div class="emoji">🎁</div><div class="desc">开盲盒 · 随机掉落一道菜（默认 30 爱心币）</div></div>
    <div class="lp-card" style="text-align:center">
      <div id="boxVisual" style="font-size:72px;line-height:1;margin:12px 0;transition:transform .4s">📦</div>
      <div id="boxHint" style="color:var(--muted);font-size:13px;margin-bottom:14px">消耗爱心币开启一次</div>
      <div class="lp-field" style="text-align:left;color:var(--muted);font-size:13px">固定消耗 <b>30</b> 爱心币（服务端计价，不可改）</div>
      <button class="lp-btn block" id="openBtn" type="button" onclick="openBlindBox()">开启盲盒</button>
    </div>
    <div class="lp-card">
      <h3>最近抽取</h3>
      <div id="historyList" class="lp-list"><div class="lp-empty"><div class="ico">📝</div><p>服务端抽取记录</p></div></div>
    </div>
  </main>
</div>
<div class="lp-modal-mask" id="bbModal" onclick="if(event.target===this)closeBb()">
  <div class="lp-modal" onclick="event.stopPropagation()">
    <div class="handle"></div>
    <div style="text-align:center;padding:8px 0">
      <div id="bbIcon" style="font-size:48px">🍜</div>
      <div id="bbTitle" style="font-weight:800;font-size:18px;margin:8px 0"></div>
      <div id="bbMsg" style="color:var(--muted);font-size:13px"></div>
    </div>
    <button class="lp-btn block" type="button" onclick="addDrawnToCart()">加入购物车</button>
    <button class="lp-btn block ghost" type="button" style="margin-top:8px" onclick="dislikeDrawn()">不喜欢这道</button>
    <button class="lp-btn block ghost" type="button" style="margin-top:8px" onclick="closeBb()">收下</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/js/love-page.js"></script>
<script>
let userId = null;
let lastDish = null;
let localHistory = [];
(async function () {
  const u = await LovePage.ready({ chefOnly: false });
  if (!u) return;
  userId = LovePage.getUserId();
  await loadHistory();
})();

async function loadHistory(){
  const box = document.getElementById('historyList');
  try {
    const r = await LovePage.api('/api/blindbox/history?limit=20');
    localHistory = (r.code===200 && Array.isArray(r.data)) ? r.data : [];
  } catch(e) { localHistory = []; }
  renderHistory();
}

function renderHistory(){
  const box = document.getElementById('historyList');
  if (!localHistory.length) {
    box.innerHTML = '<div class="lp-empty"><div class="ico">📝</div><p>暂无抽取记录</p></div>';
    return;
  }
  box.innerHTML = localHistory.slice(0,20).map(h => {
    const name = h.dishName || h.name || '';
    const time = (h.createdAt || h.time || '').toString().slice(0,19).replace('T',' ');
    const price = h.dishPrice ?? h.price ?? '-';
    const cost = h.costCoins ?? h.cost ?? '-';
    return `<div class="lp-item"><div class="row"><span class="title">${LovePage.escapeHtml(name)}</span><span class="meta">${LovePage.escapeHtml(time)}</span></div><div class="meta">💖 ${price} · 花费 ${cost}</div></div>`;
  }).join('');
}

async function openBlindBox(){
  const btn = document.getElementById('openBtn');
  const cost = 30;
  btn.disabled = true; btn.textContent = '开启中…';
  const vis = document.getElementById('boxVisual');
  vis.style.transform = 'rotate(-12deg) scale(1.08)';
  try {
    const r = await LovePage.api('/api/blindbox/draw', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, cost })
    });
    if (r.code === 200 && r.data) {
      lastDish = r.data;
      vis.textContent = '🎉';
      document.getElementById('bbIcon').textContent = '🍜';
      document.getElementById('bbTitle').textContent = lastDish.name || '抽中菜品';
      document.getElementById('bbMsg').textContent = (lastDish.description || '') + ' · 💖 ' + (lastDish.price ?? '') + '（花费 ' + (r.cost||cost) + '）';
      document.getElementById('bbModal').classList.add('show');
      await loadHistory();
    } else {
      LovePage.toast(r.message || '开启失败');
    }
  } catch (e) {
    LovePage.toast('网络错误');
  } finally {
    btn.disabled = false; btn.textContent = '开启盲盒';
    setTimeout(() => { vis.style.transform = ''; vis.textContent = '📦'; }, 800);
  }
}
function closeBb(){ document.getElementById('bbModal').classList.remove('show'); }
function addDrawnToCart(){
  if (!lastDish) return;
  let cart = [];
  try { cart = JSON.parse(localStorage.getItem('love_cart') || '[]'); } catch(e) {}
  const dishId = lastDish.id;
  const found = cart.find(c => c.dishId === dishId);
  if (found) found.quantity = (found.quantity||1)+1;
  else cart.push({ dishId, name: lastDish.name, price: lastDish.price||0, priceType: lastDish.priceType||'爱心币', quantity: 1 });
  localStorage.setItem('love_cart', JSON.stringify(cart));
  LovePage.toast('已加入购物车');
  closeBb();
}
async function dislikeDrawn(){
  if (!lastDish) return;
  try {
    const r = await LovePage.api('/api/blindbox/dislike/add', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ userId, dishId: lastDish.id })
    });
    LovePage.toast(r.message || (r.code===200 ? '已标记不喜欢' : '操作失败'));
  } catch(e) { LovePage.toast('网络错误'); }
  closeBb();
}
</script>
</body>
</html>
