<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FCE8EE">
<title>历史订单 · Love</title>
<link rel="stylesheet" href="/css/love.css?v=qa-fixes1">

<style></style>
</head>
<body>
<div class="app subpage">
  <header class="sub-header">
    <button type="button" class="back-btn" onclick="LovePage.back()" aria-label="返回">‹</button>
    <div class="sub-title" id="historyTitle">历史订单</div>
  </header>
  <main class="sub-body">
<div class="lp-hero"><div class="emoji">📜</div><div class="desc">历史订单一览</div></div>
<div id="orderList" class="lp-list"><div class="lp-empty"><div class="ico">⏳</div><p>加载中…</p></div></div>
<div class="lp-modal-mask" id="detailModal" onclick="if(event.target===this)hideDetail()">
  <div class="lp-modal" onclick="event.stopPropagation()">
    <div class="handle"></div>
    <div class="hd"><span>订单详情</span><button class="x" type="button" onclick="hideDetail()">×</button></div>
    <div id="detailBody"></div>
    <div id="detailFooter" style="margin-top:12px"></div>
  </div>
</div>
</main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/js/love-page.js?v=qa-fixes1"></script>

<script>
let userId = null;
(async function () {
  const u = await LovePage.ready({ chefOnly: false });
  if (!u) return;
  userId = LovePage.getUserId();
  if (typeof window.__afterAuth === 'function') await window.__afterAuth();
})();


const STATUS_MAP={pending:'待接单',cooking:'制作中',ready:'待取餐',completed:'已完成',cancelled:'已取消',canceled:'已取消'};
const STATUS_ALIAS={confirmed:'pending',received:'pending',preparing:'cooking',delivered:'ready'};
function normalizeStatus(s){ if(!s) return s; const k=String(s).trim().toLowerCase(); return STATUS_ALIAS[k]||k; }
function statusLabel(s){ return STATUS_MAP[normalizeStatus(s)]||s; }
async function loadOrderHistory(){
  const box=document.getElementById('orderList');
  const chef=LovePage.isChef();
  const title=document.getElementById('historyTitle');
  if(title) title.textContent=chef?'厨房历史':'历史订单';
  const hero=document.querySelector('.lp-hero .desc');
  if(hero) hero.textContent=chef?'做过的厨房订单':'历史订单一览';
  try{
    const r=chef
      ? await LovePage.api('/api/order/list')
      : await LovePage.api(`/api/order/user/${userId}`);
    const list=(r.code===200&&(r.data?.list||r.data))||[];
    const arr=Array.isArray(list)?list:[];
    if(!arr.length){ box.innerHTML='<div class="lp-empty"><div class="ico">📭</div><p>暂无订单</p></div>'; return; }
    box.innerHTML=arr.map(o=>{
      const st=statusLabel(o.status)||o.status||'未知';
      const stClass='status-pill status-'+(o.status||'');
      const no=o.orderNo||('#'+o.id);
      const amt=LovePage.formatOrderPrice(o);
      const time=(o.createTime||o.createdAt||'').toString().slice(0,16).replace('T',' ');
      return `<div class="lp-item" onclick="viewOrderDetail(${o.id})">
        <div class="row"><span class="title">${LovePage.escapeHtml(String(no))}</span><span class="${stClass}">${LovePage.escapeHtml(st)}</span></div>
        <div class="meta">${LovePage.escapeHtml(time)} · ${LovePage.escapeHtml(amt)}</div>
      </div>`;
    }).join('');
  }catch(e){ box.innerHTML='<div class="lp-empty"><p>加载失败</p></div>'; }
}
async function viewOrderDetail(orderId){
  try{
    const r=await LovePage.api(`/api/order/detail/${orderId}`);
    if(r.code!==200||!r.data){ LovePage.toast(r.message||'加载失败'); return; }
    const payload=r.data;
    const o=payload.order||payload;
    const items=payload.items||o.items||o.orderItems||[];
    const itemsHtml=items.map(it=>`<div class="meta" style="display:flex;justify-content:space-between;padding:6px 0"><span>${LovePage.escapeHtml(it.dishName||it.name||'')} ×${it.quantity||1}</span><span>${it.price??it.amount??''}</span></div>`).join('')||'<div class="meta">无明细</div>';
    document.getElementById('detailBody').innerHTML=`
      <div class="lp-card" style="margin:0;box-shadow:none;border:none;padding:0">
        <div class="title">订单 ${LovePage.escapeHtml(String(o.orderNo||('#'+o.id)))}</div>
        <div class="meta" style="margin:8px 0">订单号：${LovePage.escapeHtml(String(o.orderNo||'-'))}</div>
        <div class="meta" style="margin:8px 0">状态：${LovePage.escapeHtml(statusLabel(o.status)||o.status||'未知')}${o.userId!=null?' · 用户 #'+o.userId:''}</div>
        ${(function(){ const fr=o.completedAt||o.finishTime||o.finishedAt||(normalizeStatus(o.status)==='completed'?(o.updatedAt||o.updateTime):null); if(!fr) return ''; const t=String(fr).slice(0,19).replace('T',' '); return '<div class="meta">完成时间：'+LovePage.escapeHtml(t)+'</div>'; })()}
        <div class="meta">备注：${LovePage.escapeHtml(o.remark||'无')}</div>
        <hr style="border:none;border-top:1px dashed var(--rose-line);margin:10px 0">
        ${itemsHtml}
        <div style="margin-top:10px;font-weight:800;color:var(--rose)">合计 ${LovePage.escapeHtml(LovePage.formatOrderPrice(o))}</div>
      </div>`;
    const canCancel=normalizeStatus(o.status)==='pending';
    document.getElementById('detailFooter').innerHTML=canCancel
      ? `<button class="lp-btn block danger" type="button" onclick="cancelOrder('${LovePage.escapeHtml(String(o.orderNo||o.id))}')">取消订单</button>`
      : '';
    document.getElementById('detailModal').classList.add('show');
  }catch(e){ LovePage.toast('网络错误'); }
}
function hideDetail(){ document.getElementById('detailModal').classList.remove('show'); }
async function cancelOrder(orderNo){
  if(!confirm('确定取消该订单？')) return;
  try{
    const r=await LovePage.api('/api/order/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderNo,userId:LovePage.getUserId()})});
    if(r.code===200){ LovePage.toast('已取消'); hideDetail(); loadOrderHistory(); }
    else LovePage.toast(r.message||'取消失败');
  }catch(e){ LovePage.toast('网络错误'); }
}
window.__afterAuth=loadOrderHistory;

</script>
</body>
</html>
