server:
  port: 8080
  servlet:
    session:
      timeout: 30d
      cookie:
        name: LOVESESSION
        max-age: 30d
        http-only: true
        same-site: lax

# 数据库配置（Docker 环境）
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/love_order_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=30000
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # Thymeleaf配置
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: true  # 生产环境启用缓存

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.wrt.excel.order.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl  # 生产环境使用 SLF4J
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 限流配置
rate-limiter:
  default-qps: 10
  apis:
    upload-api: 5
    query-api: 20

# 第三方接口配置
provincial:
  api:
    url: http://localhost:8081/provincial

# Actuator 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# 日志配置（生产环境）
logging:
  level:
    com.wrt.excel: INFO
    root: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /app/logs/application.log
# DeepSeek 一句话点单
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  model: deepseek-chat
  timeout-seconds: 30

love:
  remember:
    secret: ${LOVE_REMEMBER_SECRET:LoveRememberMeKey2024Private}
  upload:
    dir: uploads

# WeChat MP 测试号（密钥仅来自环境变量，勿把 secret 写进仓库）
wechat:
  enabled: ${WECHAT_ENABLED:true}
  app-id: ${WECHAT_APP_ID:}
  app-secret: ${WECHAT_APP_SECRET:}
  token: ${WECHAT_TOKEN:}
  chef-openid: ${WECHAT_CHEF_OPENID:}
  orderer-openid: ${WECHAT_ORDERER_OPENID:}
  template-new-order: ${WECHAT_TEMPLATE_NEW_ORDER:}
  template-status: ${WECHAT_TEMPLATE_STATUS:}

# 高德 Web 服务 Key（逆地理）；未配置时家人位置只显示经纬度
amap:
  web-key: ${AMAP_WEB_KEY:}
  regeo-url: https://restapi.amap.com/v3/geocode/regeo
  timeout-seconds: 3
